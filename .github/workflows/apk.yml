name: Fabricar APK y AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'icons/**', 'ci/**', '.github/workflows/apk.yml']

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verificar conexion con Firebase (referidos)
        continue-on-error: true
        run: |
          KEY=$(grep -o 'AIzaSy[A-Za-z0-9_-]\{33\}' app/index.html | head -1 || true)
          [ -z "$KEY" ] && KEY="AIzaSyB74m7vrzLxK7epM5WIWCI_rfz7QmbkfgY"
          R=$(curl -s -w "\nHTTP %{http_code}" -X POST "https://firestore.googleapis.com/v1/projects/control-gastos-ve/databases/(default)/documents:runQuery?key=$KEY" -H "Content-Type: application/json" -d '{"structuredQuery":{"from":[{"collectionId":"referidos"}],"limit":1}}')
          echo "$R"
          if echo "$R" | grep -q "HTTP 200"; then echo "### ✅ Firebase conectado (referidos)" >> $GITHUB_STEP_SUMMARY; else echo "### ❌ Firebase NO responde bien" >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; echo "$R" >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; exit 1; fi
      - name: Verificar tasa BCV histórica (DolarAPI)
        continue-on-error: true
        run: |
          D=$(date -u -d '7 days ago' +%Y/%m/%d)
          R1=$(curl -s -m 20 "https://ve.dolarapi.com/v1/historicos/dolares/oficial/$D" | head -c 300)
          R2=$(curl -s -m 20 "https://ve.dolarapi.com/v1/historicos/dolares/oficial" | head -c 300)
          echo "Por fecha ($D): $R1"; echo "Lista: $R2"
          if echo "$R1$R2" | grep -q promedio; then echo "HIST=OK" >> $GITHUB_ENV; else echo "HIST=FALLA" >> $GITHUB_ENV; fi
      - name: Construir y firmar
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ci/build.sh
      - name: Guardar AAB para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: Control_de_Gastos_PlayStore_AAB
          path: Control_de_Gastos_PlayStore.aab
          retention-days: 60
      - name: Publicar el APK (siempre en el mismo lugar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="3.3.${{ github.run_number }}"
          NOTES="Versión $VER. Tasa histórica BCV: ${HIST:-sin verificar}. Descarga **Control_de_Gastos.apk** aquí abajo e instálalo encima de la app que ya tienes (toca Actualizar). Página oficial: https://goa-business.github.io/control-gastos/"
          if gh release view app >/dev/null 2>&1; then
            gh release upload app Control_de_Gastos.apk --clobber
            gh release edit app --title "Control de Gastos y Bancos $VER" --notes "$NOTES" --latest
          else
            gh release create app Control_de_Gastos.apk --title "Control de Gastos y Bancos $VER" --notes "$NOTES" --latest
          fi
          # borrar las versiones viejas para que quede un solo archivo
          for t in $(gh release list --limit 50 --json tagName --jq '.[].tagName' | grep -v '^app$'); do gh release delete "$t" --yes --cleanup-tag || true; done
